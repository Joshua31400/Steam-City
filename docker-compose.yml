services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: steamcity_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - steamcity_network
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: steamcity_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - steamcity_network
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: steamcity_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-steam_city}
      MYSQL_USER: ${DB_USER:-steamcity_user}
      MYSQL_PASSWORD: ${DB_PASS:-steamcity_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/database.sql:/docker-entrypoint-initdb.d/database.sql
    networks:
      - steamcity_network
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: steamcity_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    networks:
      - steamcity_network
    depends_on:
      - mysql

networks:
  steamcity_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local