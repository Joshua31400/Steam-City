<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website for Steam City. Login to access your account.">
    <title>Steam City | Login</title>
    <link rel="stylesheet" href="/style/login.css">
</head>

<body>
    <!-- Vidéo de fond en boucle -->
    <video class="wallpaper-background" autoplay muted loop playsinline>
        <source src="/media/video_bg.mp4" type="video/mp4">
        <!-- Fallback si la vidéo ne charge pas -->
        <img src="/img/background.png" alt="Background">
    </video>

    <main class="login-container">
        <section class="glass-panel">
            <div class="form-wrapper"> 
                <h1 class="retro-title">Welcome Back</h1>

                <form action="/login/process" method="POST">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="john.doe@gmail.com" autocomplete="email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Type here..." autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn-login">LOGIN</button>

                    <div class="social-login">
                        <a href="/auth/google" class="btn-google">
                            <img src="/img/google-icon.svg" alt="" aria-hidden="true"> Google
                        </a>
                        <a href="/auth/github" class="btn-github">
                            <img src="/img/github-icon.svg" alt="" aria-hidden="true"> Github
                        </a>
                    </div>

                    <div class="signup-link">
                        <a href="/signup">Sign Up</a>
                    </div>
                </form>
            </div>
        </section>

        <aside class="login-visual"></aside>
    </main>
</body>
</html>
