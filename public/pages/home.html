<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Website for Steam City, a platform for gaming enthusiasts. Home page showcasing the latest games, news, and features.">
    <title>Steam City | Home</title>
</head>
<body>
<header class="main-header">
    <div class="brand">
        <h1>HOME</h1>
    </div>

    <nav class="user-nav" aria-label="User Menu">
        <ul>
            <li>
                <a href="/home" aria-label="Home">
                    <img src="#" alt="" aria-hidden="true">
                </a>
            </li>
            <li>
                <a href="/profile" aria-label="My Profile">
                    <img src="#" alt="" aria-hidden="true">
                </a>
            </li>
            <li>
                <button type="button" aria-label="Logout">
                    <img src="#" alt="" aria-hidden="true">
                </button>
            </li>
        </ul>
    </nav>
</header>

<main class="home-content">
    <section class="search-section">
        <form role="search">
            <label for="game-search" class="sr-only">Search for a game</label>
            <div class="search-wrapper">
                <img src="#" alt="" aria-hidden="true" class="search-icon">
                <input
                        type="search"
                        id="game-search"
                        name="q"
                        placeholder="Search for a game..."
                        autocomplete="off">
            </div>
        </form>
    </section>

    <section class="games-grid">
        <article class="game-card">
            <div class="card-header">
                <button type="button" class="btn-add" aria-label="Add to my list">
                    <img src="#" alt="" aria-hidden="true">
                </button>
            </div>

            <figure class="card-image">
                <img src="#" alt="Cover of Game Name">
            </figure>

            <div class="card-content">
                <span class="game-tag">FPS</span>
                <h2>Game Name</h2>
                <p>Desc: Play Battle Royal or R&D and every famous game mode</p>
            </div>

            <div class="card-footer">
                <ul class="trophies-list" aria-label="Earned trophies">
                    <li><img src="#" alt="Bronze Trophy"></li>
                    <li><img src="#" alt="Silver Trophy"></li>
                    <li><img src="#" alt="Gold Trophy"></li>
                </ul>
            </div>
        </article>

        <article class="game-card">
            <div class="card-header">
                <button type="button" class="btn-add" aria-label="Add to my list">
                    <img src="#" alt="">
                </button>
            </div>
            <figure class="card-image">
                <img src="#" alt="Game cover">
            </figure>
            <div class="card-content">
                <span class="game-tag">FPS</span>
                <h2>Game Name</h2>
                <p>Desc: Play Battle Royal or R&D and every famous game mode</p>
            </div>
            <div class="card-footer">
                <ul class="trophies-list">
                    <li><img src="#" alt=""></li>
                    <li><img src="#" alt=""></li>
                    <li><img src="#" alt=""></li>
                </ul>
            </div>
        </article>
    </section>
</main>
</body>
</html>
