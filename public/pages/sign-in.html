<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website for Steam City, a platform for gaming enthusiasts. Sign in to create a new account and join the gaming community.">
    <title>Steam City | Sign-in</title>
    <link rel="stylesheet" href="/style/sign-in.css">
</head>

<body>

    <!-- Vidéo de fond en boucle -->
<video class="wallpaper-background" autoplay muted loop playsinline>
    <source src="/media/video_bg.mp4" type="video/mp4">
    <!-- Fallback si la vidéo ne charge pas -->
    <img src="/img/background.png" alt="Background">
</video>

<main class="auth-container">
    <section class="auth-form">
        <h1>Sign-in</h1>
        <form action="/register" method="POST">
            <div class="input-group">
                <label for="email">Email</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="john.doe@gmail.com"
                        autocomplete="email"
                        required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Type here..."
                        autocomplete="new-password"
                        minlength="8"
                        required>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="Type here..."
                        autocomplete="new-password"
                        required>
            </div>

            <button type="submit" class="btn-primary">SIGN-IN</button>

            <div class="social-login">
                <span>Sign in with</span>
                <a href="/auth/google" class="btn-google">
                    <img src="#" alt="" aria-hidden="true"> GOOGLE
                </a>

                <a href="/auth/github" class="btn-github">
                    <img src="#" alt="" aria-hidden="true"> SIGN-IN WITH GITHUB
                </a>
            </div>

            <div class="auth-switch">
                <a href="/login">Already have an account ?</a>
            </div>
        </form>
    </section>

    <aside class="auth-visual" aria-label="Décoration Vaporwave"></aside>
</main>
</body>
</html>
