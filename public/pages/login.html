<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website for Steam City, a platform for gaming enthusiasts. Login to access your account and enjoy the latest games and features.">
    <title>Steam City | Login</title>
</head>
<body>
<main class="login-container">
    <section class="login-form">
        <h1>Welcome Back</h1>

        <form action="/login" method="POST">

            <div class="input-group">
                <label for="email">Email</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="john.doe@gmail.com"
                        autocomplete="email"
                        required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Type here..."
                        autocomplete="current-password"
                        required>
            </div>

            <button type="submit" class="btn-login">LOGIN</button>

            <div class="social-login">
                <button type="button" class="btn-google">
                    <img src="#" alt="" aria-hidden="true"> Google
                </button>

                <button type="button" class="btn-github">
                    <img src="#" alt="" aria-hidden="true"> Github
                </button>
            </div>

            <div class="signup-link">
                <a href="/signup">Sign Up</a>
            </div>

        </form>
    </section>

    <aside class="login-visual" aria-label="Décoration Vaporwave">
    </aside>
</main>
</body>
</html>
